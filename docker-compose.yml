services:
    web:
        build:
            target: web
            context: .
        env_file:
            - .env
        ports:
            - "8080:80"
           # - "5173:5173"  # Port za Vite dev server (vue)
        volumes:
            - .:/var/www/html:cached
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            - db
        networks:
            - app-network

    db:
        platform: "linux/amd64"
        image: mysql:5.7
        env_file:
            - .env
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: uros
            MYSQL_PASSWORD: password
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_USER: uros
            PMA_PASSWORD: password
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
    vendor_data:
    node_modules_data:
