on: push
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Get latest code
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 2️⃣ PHP setup + Composer
      - name: ⚡ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # 3️⃣ install PHP dependencies
      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4️⃣ Node.js setup
      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 5️⃣ install Node.js dependencies
      - name: 📦 Install Node.js dependencies
        run: npm install

      # 6️⃣ Build frontend
      - name: 🎨 Build frontend assets
        run: npm run build

      # 7️⃣ create .env on server
      - name: 🔑 Create .env file on server
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 8️⃣ Upload files on server (include vendor)
      - name: 📂 Sync files with cleanup
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.urosdeveloper.com
          username: urosdeve@dashboard.urosdeveloper.com
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            node_modules/
            storage/
            .git/
            .github/
          include: |
            vendor/**
            public/build/**  # frontend build
          sync-strategy: times

      # 9️⃣ Clear Laravel cache on server
      - name: 🧹 Clear Laravel cache on server
        run: |
          ssh urosdeve@ftp.urosdeveloper.com "cd /home/urosdeve/dashboard.urosdeveloper.com && rm -f bootstrap/cache/*.php && php artisan config:clear && php artisan cache:clear"
