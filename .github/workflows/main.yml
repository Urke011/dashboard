on: push
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Upload code to server
        uses: appleboy/scp-action@v0.1.6
        with:
          host: dashboard.urosdeveloper.com
          username: urosdeve@dashboard.urosdeveloper.com
          port: 2217
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "/home/urosdeve/dashboard.urosdeveloper.com"
          overwrite: true

      - name: 🔧 Run composer & npm on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: dashboard.urosdeveloper.com
          username: urosdeve@dashboard.urosdeveloper.com
          port: 2217
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/urosdeve/dashboard.urosdeveloper.com
            php -r "copy('.env.example', '.env');" || true
            php ~/bin/composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            php artisan migrate --force
