name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: ⚡ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: npm install

      - name: 🎨 Build frontend assets
        run: npm run build

      - name: 🔑 Create .env file on server
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: 📂 Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.urosdeveloper.com
          username: urosdeve@dashboard.urosdeveloper.com
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            node_modules/
            vendor/
            storage/
            .git/
            .github/
          sync-strategy: times

      - name: 🖥️ Run migrations and seed via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ftp.urosdeveloper.com
          username: laravel-stock-project
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/urosdeve/dashboard.urosdeveloper.com
            php artisan migrate --force
            php artisan db:seed --force
