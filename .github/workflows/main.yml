on: push
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 2️⃣ PHP setup + Composer
      - name: ⚡ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # 3️⃣ Install PHP dependencies (vendor/)
      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4️⃣ Node.js setup
      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 5️⃣ Install Node.js dependencies
      - name: 📦 Install Node.js dependencies
        run: npm install

      # 6️⃣ Build frontend
      - name: 🎨 Build frontend assets
        run: npm run build

      # 7️⃣ Create .env on server
      - name: 🔑 Create .env file on server
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 8️⃣ Deploy everything via FTP
      - name: 📂 Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.urosdeveloper.com
          username: urosdeve@dashboard.urosdeveloper.com
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./
          exclude: |
            node_modules/
            storage/
            .git/
            .github/
